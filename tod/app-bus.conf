<!-- Private, non-activating bus for the guarded fprintd session.

     This differs from private-bus.conf in one directive: connections are
     allowed from any uid. The session deliberately spans two accounts — the
     daemon needs root for USB, while the window belongs to the desktop user —
     and without <allow user="*"/> dbus-daemon refuses whichever side does not
     own the socket, with a bare NoReply.

     keep_umask is deliberately absent so dbus-daemon does not narrow the socket
     before the wrapper can set its ownership. The wrapper then gives the socket
     to the desktop user with the group set to root and mode 0660, so exactly
     the two parties of this session reach it and no other account does. The
     daemon runs under bubblewrap, which drops the capability that would let
     root ignore mode bits, so it is admitted through the group instead.

     The socket lives only for one session, inside a per-run directory, and
     carries no secret — the PSK reaches the driver by file and environment,
     never over this bus. -->
<busconfig>
  <type>system</type>
  <listen>@BUS_ADDRESS@</listen>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
