<!-- Private, non-activating bus used only by the no-USB workspace smoke test. -->
<busconfig>
  <type>system</type>
  <keep_umask/>
  <listen>@BUS_ADDRESS@</listen>
  <policy context="default">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
