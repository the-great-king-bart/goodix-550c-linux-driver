<!-- Private, non-activating bus for the guarded fprintd session.

     This differs from private-bus.conf in one directive: connections are
     allowed from any uid. The session deliberately spans two accounts — the
     daemon needs root for USB, while the window belongs to the desktop user —
     and without <allow user="*"/> dbus-daemon refuses whichever side does not
     own the socket, with a bare NoReply.

     keep_umask is deliberately absent so the socket is created world-accessible:
     the daemon runs under bubblewrap, which drops the capability that would
     otherwise let root ignore the owning user's mode bits. The socket exists
     only for the length of one session, inside a per-run directory, and carries
     no secret — the PSK reaches the driver by file and environment, never over
     this bus. -->
<busconfig>
  <type>system</type>
  <listen>@BUS_ADDRESS@</listen>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
